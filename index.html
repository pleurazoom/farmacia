<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Farmacia App</title>
</head>
<body>
<p>Redirigiendo a la aplicacion...</p>
<p id="fallback" style="display:none">Si no redirige automaticamente, <a id="fallbackLink" href="#">click aqui</a>.</p>
<script>
fetch('url.txt')
  .then(function(r) { return r.text(); })
  .then(function(url) {
    url = url.trim();
    if (url.startsWith('http')) {
      document.getElementById('fallbackLink').href = url;
      document.getElementById('fallback').style.display = '';
      window.location.replace(url);
    }
  })
  .catch(function() {});
</script>
</body>
</html>
