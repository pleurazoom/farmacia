<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Farmacia App</title>
<script>
fetch('url.txt')
  .then(r => r.text())
  .then(url => {
    url = url.trim();
    if (url.startsWith('http')) {
      window.location.replace(url);
    }
  })
  .catch(() => {});
</script>
</head>
<body>
<p>Cargando aplicacion...</p>
<p id="link" style="display:none">Si no redirige automaticamente, <a id="fallback" href="#">click aqui</a>.</p>
<script>
fetch('url.txt')
  .then(r => r.text())
  .then(url => {
    url = url.trim();
    if (url.startsWith('http')) {
      document.getElementById('fallback').href = url;
      document.getElementById('link').style.display = '';
    }
  })
  .catch(() => {});
</script>
</body>
</html>
